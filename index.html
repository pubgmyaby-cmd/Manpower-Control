              )}

              {/* DATABASE PANEL & LOGS */}
              {activeTab === "database_panel" && isSuperuser && (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-in fade-in">
                  <div className={`${cardStyle} lg:col-span-2 space-y-4`}>
                    <h4 className="text-xs font-black uppercase text-indigo-700 flex items-center gap-2">
                      <span className="inline-block w-2 h-2 rounded-full bg-indigo-500"></span>
                      🛰️ WebSocket Real-Time & Pessimistic Locks Log
                    </h4>
                    <div className="overflow-x-auto border rounded-xl shadow-sm">
                      <table className="w-full text-[11px] text-left">
                        <thead className="bg-slate-100 text-slate-600 font-black">
                          <tr>
                            <th className="p-2">Waktu</th>
                            <th className="p-2">Tipe</th>
                            <th className="p-2 text-center">Status</th>
                            <th className="p-2">Log Informasi</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 font-mono">
                          {networkLogs.length === 0 ? (
                            <tr>
                              <td
                                colSpan="4"
                                className="p-4 text-center text-slate-400 italic"
                              >
                                Belum ada aktivitas terekam.
                              </td>
                            </tr>
                          ) : (
                            networkLogs.map((log, idx) => (
                              <tr key={idx} className="hover:bg-slate-50">
                                <td className="p-2 text-slate-500 font-bold">
                                  {log.timestamp}
                                </td>
                                <td className="p-2 font-black text-indigo-900">
                                  {log.passName}
                                </td>
                                <td className="p-2 text-center">
                                  <span
                                    className={`px-2 py-0.5 rounded font-black text-[9px] ${
                                      log.status === "SUCCESS" ||
                                      log.status === "RELEASED" ||
                                      log.status === "APPLIED"
                                        ? "bg-emerald-100 text-emerald-800"
                                        : log.status === "LOCKED"
                                          ? "bg-amber-100 text-amber-800"
                                          : "bg-rose-100 text-rose-800"
                                    }`}
                                  >
                                    {log.status}
                                  </span>
                                </td>
                                <td className="p-2 text-slate-600">
                                  {log.details}
                                </td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div className="space-y-6">
                    <div className={cardStyle}>
                      <h4 className="text-xs font-black uppercase mb-4 text-indigo-700">
                        🔒 Table Cell Terkunci (Active Locks)
                      </h4>
                      <div className="space-y-2">
                        {Object.keys(activeLocks).length === 0 ? (
                          <div className="text-xs text-slate-400 italic text-center py-4">
                            Tidak ada field/cell yang sedang terkunci.
                          </div>
                        ) : (
                          Object.entries(activeLocks).map(([key, info]) => (
                            <div
                              key={key}
                              className="p-2 bg-amber-50 border border-amber-200 rounded-xl flex justify-between items-center text-xs"
                            >
                              <div>
                                <span className="font-mono font-bold text-amber-900 block truncate max-w-[150px]">
                                  {key}
                                </span>
                                <span className="text-[9px] text-amber-700 block">
                                  Editor: {info.userLabel} ({info.userCode})
                                </span>
                              </div>
                              <span className="text-[9px] bg-amber-600 text-white font-black px-2 py-0.5 rounded">
                                LOCKED
                              </span>
                            </div>
                          ))
                        )}
                      </div>
                    </div>

                    <div className={cardStyle}>
                      <h4 className="text-xs font-black uppercase mb-4 text-emerald-700">
                        💾 Ekspor & Impor Cadangan (JSON)
                      </h4>
                      <div className="space-y-4 text-xs">
                        <p className="text-slate-500">
                          Gunakan file lokal .json jika ingin mencadangkan atau
                          merestorasi database secara manual.
                        </p>
                        <div className="flex gap-2">
                          <button
                            onClick={exportDatabaseJSON}
                            className={btnPrimary}
                          >
                            Ekspor Database (.json)
                          </button>
                          <label className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold p-2.5 rounded-xl cursor-pointer text-center text-xs flex-1 border">
                            Impor Database
                            <input
                              type="file"
                              accept=".json"
                              onChange={importDatabaseJSON}
                              className="hidden"
                            />
                          </label>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </main>

            {/* EDIT USER ACCOUNT MODAL */}
            {editingUser && (
              <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex justify-center items-center z-50 p-4">
                <form
                  onSubmit={handleUpdateUser}
                  className="bg-white p-6 rounded-3xl max-w-md w-full border border-slate-200 shadow-xl space-y-4"
                >
                  <h4 className="text-xs font-black uppercase text-indigo-700">
                    ✏️ Edit Akun User [{editingUser.code}]
                  </h4>

                  <div>
                    <label className="text-[10px] font-bold block text-slate-500 mb-1">
                      Label Nama:
                    </label>
                    <input
                      type="text"
                      required
                      value={editingUser.label}
                      onChange={(e) =>
                        setEditingUser({
                          ...editingUser,
                          label: e.target.value,
                        })
                      }
                      className={inputClass}
                    />
                  </div>

                  <div>
                    <label className="text-[10px] font-bold block text-slate-500 mb-1">
                      Password Baru:
                    </label>
                    <input
                      type="text"
                      required
                      value={editingUser.pass}
                      onChange={(e) =>
                        setEditingUser({ ...editingUser, pass: e.target.value })
                      }
                      className={inputClass}
                    />
                  </div>

                  <div>
                    <label className="text-[10px] font-bold block text-slate-500 mb-1">
                      Role / Peran:
                    </label>
                    <select
                      value={editingUser.role}
                      onChange={(e) =>
                        setEditingUser({ ...editingUser, role: e.target.value })
                      }
                      className={inputClass}
                    >
                      <option value="Superuser">Superuser</option>
                      <option value="PMO General">PMO General</option>
                      <option value="PMO IKS">PMO - IKS</option>
                      <option value="PMO HAF">PMO - HAF</option>
                      <option value="PMO BHP">PMO - BHP</option>
                      {cells.map((c) => (
                        <option key={c.code} value={`${c.code} Cell Leader`}>
                          Pimpinan Sel - {c.code}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setEditingUser(null)}
                      className={btnSecondary}
                    >
                      Batal
                    </button>
                    <button type="submit" className={btnPrimary}>
                      Simpan Perubahan
                    </button>
                  </div>
                </form>
              </div>
            )}

            {/* PLOTTING MODAL OVERLAY */}
            {activePlotCell && (
              <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex justify-center items-center z-50 p-4">
                <div
                  className="bg-white p-6 rounded-3xl max-w-lg w-full border border-slate-200 shadow-xl space-y-4"
                  onChange={resetLockInactivityTimer}
                  onKeyDown={resetLockInactivityTimer}
                >
                  <div className="flex justify-between items-center border-b pb-2">
                    <h4 className="text-xs font-black uppercase text-indigo-700">
                      👥 Alokasi Aktual Personil - {activePlotCell.weekId}
                    </h4>
                    <span className="text-[9px] bg-amber-500 text-white font-black px-2 py-0.5 rounded shadow">
                      🔒 LOCK ACTIVE (30s Timeout)
                    </span>
                  </div>
                  <p className="text-[10px] text-slate-400 font-semibold leading-tight">
                    Cell ini dikunci eksklusif untuk Anda. Timer 30 detik akan
                    mereset setiap ada aktivitas keyboard/input.
                  </p>

                  <div className="space-y-3 max-h-[300px] overflow-y-auto pr-1 scrollbar-thin">
                    {plotMembers.map((pm, idx) => (
                      <div
                        key={idx}
                        className="flex gap-2 items-center bg-slate-50 p-2.5 rounded-xl border border-slate-100"
                      >
                        <select
                          value={pm.member}
                          onChange={(e) => {
                            const next = [...plotMembers];
                            next[idx].member = e.target.value;
                            next[idx].isVendor = e.target.value === "VND";
                            setPlotMembers(next);
                            resetLockInactivityTimer();
                          }}
                          className="bg-white border rounded p-1 text-xs font-bold flex-1"
                        >
                          <option value="">-- Pilih Anggota --</option>
                          <option value="VND">🛠️ Vendor Support</option>
                          {(members[activePlotCell.cellOwner] || []).map(
                            (m) => (
                              <option key={m.id} value={m.id}>
                                {m.id}
                              </option>
                            ),
                          )}
                        </select>

                        <div className="text-center">
                          <span className="text-[7px] text-slate-400 block font-bold">
                            WD %
                          </span>
                          <input
                            type="number"
                            min="0"
                            max="100"
                            step="10"
                            value={pm.wd_plot}
                            onChange={(e) => {
                              const next = [...plotMembers];
                              next[idx].wd_plot =
                                parseInt(e.target.value, 10) || 0;
                              setPlotMembers(next);
                              resetLockInactivityTimer();
                            }}
                            className="w-14 p-1 text-xs border rounded text-center font-bold"
                            placeholder="WD %"
                          />
                        </div>

                        <div className="text-center">
                          <span className="text-[7px] text-slate-400 block font-bold">
                            WE %
                          </span>
                          <input
                            type="number"
                            min="0"
                            max="10"
                            value={pm.we_plot}
                            onChange={(e) => {
                              const next = [...plotMembers];
                              next[idx].we_plot =
                                parseInt(e.target.value, 10) || 0;
                              setPlotMembers(next);
                              resetLockInactivityTimer();
                            }}
                            className="w-14 p-1 text-xs border rounded text-center font-bold"
                            placeholder="WE %"
                          />
                        </div>

                        <button
                          onClick={() => {
                            setPlotMembers(
                              plotMembers.filter((_, i) => i !== idx),
                            );
                            resetLockInactivityTimer();
                          }}
                          className="text-red-500 font-bold"
                        >
                          ✕
                        </button>
                      </div>
                    ))}
                  </div>
                  <div className="flex gap-2 justify-between">
                    <button
                      onClick={() => {
                        setPlotMembers([
                          ...plotMembers,
                          {
                            member: "",
                            wd_plot: 100,
                            we_plot: 0,
                            isVendor: false,
                          },
                        ]);
                        resetLockInactivityTimer();
                      }}
                      className={btnSecondary}
                    >
                      + Anggota
                    </button>
                    <div className="flex gap-2">
                      <button
                        onClick={closePlottingModal}
                        className={btnSecondary}
                      >
                        Batal & Release Lock
                      </button>
                      <button
                        onClick={handleSavePlotting}
                        className={btnPrimary}
                      >
                        Simpan Plotting
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* MEMBER CONTROL DETAIL POPUP MODAL */}
            {selectedMemberWeekDetail && (
              <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex justify-center items-center z-50 p-4">
                <div className="bg-white p-6 rounded-3xl max-w-lg w-full border border-slate-200 shadow-2xl space-y-4 animate-in fade-in zoom-in-95">
                  <div className="flex justify-between items-start border-b pb-3">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="bg-indigo-600 text-white text-[10px] font-black px-2 py-0.5 rounded-md uppercase">
                          Member Control
                        </span>
                        <h4 className="text-sm font-black text-slate-900">
                          {selectedMemberWeekDetail.member.id} -{" "}
                          {selectedMemberWeekDetail.member.name}
                        </h4>
                      </div>
                      <span className="text-[11px] text-slate-500 font-bold block mt-1">
                        Sel {selectedMemberWeekDetail.cellCode} •{" "}
                        {selectedMemberWeekDetail.week.weekLabel} (
                        {selectedMemberWeekDetail.week.formattedDate})
                      </span>
                    </div>
                    <button
                      onClick={() => setSelectedMemberWeekDetail(null)}
                      className="p-1 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 font-black text-sm transition-all"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100 flex justify-between items-center text-xs">
                    <div>
                      <span className="text-[10px] font-extrabold text-slate-400 uppercase block">
                        Total Load Minggu Ini:
                      </span>
                      <span
                        className={`font-black text-sm ${selectedMemberWeekDetail.totalWd > 100 ? "text-rose-600" : "text-indigo-600"}`}
                      >
                        {selectedMemberWeekDetail.totalWd}% Weekday{" "}
                        {selectedMemberWeekDetail.totalWe > 0
                          ? `| +${selectedMemberWeekDetail.totalWe}% Weekend`
                          : ""}
                      </span>
                    </div>
                    <div className="text-right">
                      <span className="text-[10px] font-extrabold text-slate-400 uppercase block">
                        Jumlah Proyek:
                      </span>
                      <span className="font-black text-slate-800 text-sm">
                        {selectedMemberWeekDetail.assignments.length} Proyek
                      </span>
                    </div>
                  </div>

                  <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 block border-b pb-1">
                    📋 Rincian Plotting Terdaftar (
                    {selectedMemberWeekDetail.assignments.length})
                  </span>

                  <div className="space-y-2.5 max-h-[280px] overflow-y-auto pr-1 scrollbar-thin">
                    {selectedMemberWeekDetail.assignments.map(
                      (assignment, idx) => {
                        const mh = calculateManHours(
                          assignment.wd_plot / 100,
                          assignment.we_plot / 100,
                        );
                        return (
                          <div
                            key={idx}
                            className="p-3.5 bg-slate-50 border border-slate-200 rounded-2xl space-y-2 hover:border-indigo-300 transition-all"
                          >
                            <div className="flex justify-between items-start">
                              <div>
                                <span className="text-xs font-extrabold text-indigo-900 block">
                                  {assignment.copro} - {assignment.projName}
                                </span>
                                <span className="text-[10px] text-slate-500 font-bold block mt-0.5">
                                  Role: {assignment.roleName} (Sel PIC:{" "}
                                  {assignment.cellOwner})
                                </span>
                              </div>
                              <span className="text-[9px] bg-indigo-100 text-indigo-800 font-black px-2 py-0.5 rounded-full shrink-0">
                                PMO: {assignment.pmo}
                              </span>
                            </div>

                            <div className="flex justify-between items-center text-[11px] pt-2 border-t border-slate-200/60">
                              <div className="flex gap-2">
                                <span className="font-extrabold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-lg border border-emerald-200">
                                  WD: {assignment.wd_plot}%
                                </span>
                                {assignment.we_plot > 0 && (
                                  <span className="font-extrabold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-lg border border-amber-200">
                                    WE: {assignment.we_plot}%
                                  </span>
                                )}
                              </div>
                              <span className="font-black text-slate-700">
                                {mh} Man-Hours (MH)
                              </span>
                            </div>
                          </div>
                        );
                      },
                    )}
                  </div>

                  <div className="pt-2">
                    <button
                      onClick={() => setSelectedMemberWeekDetail(null)}
                      className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs py-2.5 rounded-xl transition-all"
                    >
                      Tutup Rincian
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* AUTH LOGIN MODAL */}
            {showAuthModal && (
              <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex justify-center items-center z-50">
                <form
                  onSubmit={handleAuthSubmit}
                  className="bg-white p-6 rounded-3xl border shadow-xl w-80 space-y-4"
                >
                  <h4 className="text-xs font-black uppercase text-indigo-700">
                    🔓 Otorisasi Kolaborator
                  </h4>
                  {authError && (
                    <div className="text-xs font-bold text-red-600 bg-red-50 p-2 rounded">
                      {authError}
                    </div>
                  )}
                  <input
                    type="text"
                    placeholder="User ID"
                    required
                    value={loginInputCode}
                    onChange={(e) => setLoginInputCode(e.target.value)}
                    className={inputClass}
                  />
                  <input
                    type="password"
                    placeholder="Password"
                    required
                    value={loginInputPass}
                    onChange={(e) => setLoginInputPass(e.target.value)}
                    className={inputClass}
                  />
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setShowAuthModal(false)}
                      className="w-full bg-slate-100 py-2 rounded-xl text-xs font-bold"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="w-full bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold"
                    >
                      Login
                    </button>
                  </div>
                </form>
              </div>
            )}

            {/* CONFIRMATION & ALERT OVERLAYS */}
            {alertBox.show && (
              <div className="fixed inset-0 bg-slate-950/60 flex justify-center items-center z-50">
                <div className="bg-white p-5 rounded-2xl max-w-sm border shadow-lg space-y-3">
                  <h5 className="font-bold text-slate-900 text-sm">
                    {alertBox.title}
                  </h5>
                  <p className="text-xs text-slate-500 leading-relaxed">
                    {alertBox.message}
                  </p>
                  <button
                    onClick={() =>
                      setAlertBox({
                        show: false,
                        title: "",
                        message: "",
                        type: "info",
                      })
                    }
                    className="w-full bg-indigo-600 text-white font-bold text-xs py-2 rounded-xl"
                  >
                    Mengerti
                  </button>
                </div>
              </div>
            )}

            {confirmBox.show && (
              <div className="fixed inset-0 bg-slate-950/60 flex justify-center items-center z-50">
                <div className="bg-white p-5 rounded-2xl max-w-sm border shadow-lg space-y-3">
                  <h5 className="font-bold text-slate-900 text-sm">
                    {confirmBox.title}
                  </h5>
                  <p className="text-xs text-slate-500 leading-relaxed">
                    {confirmBox.message}
                  </p>
                  <div className="flex gap-2">
                    <button
                      onClick={
                        confirmBox.onCancel ||
                        (() =>
                          setConfirmBox({
                            show: false,
                            title: "",
                            message: "",
                            onConfirm: null,
                            onCancel: null,
                          }))
                      }
                      className="w-full bg-slate-100 py-2 rounded-xl text-xs font-bold hover:bg-slate-200 transition-all"
                    >
                      {confirmBox.cancelText || "Batal"}
                    </button>
                    <button
                      onClick={confirmBox.onConfirm}
                      className="w-full bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold hover:bg-indigo-500 transition-all shadow-md"
                    >
                      {confirmBox.confirmText || "Konfirmasi"}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TOAST SYSTEM */}
            {toast.show && (
              <div className="fixed bottom-4 right-4 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl z-50 border border-slate-800 animate-in slide-in-from-bottom-5">
                <span className="text-xs font-black uppercase text-indigo-400 block">
                  {toast.title}
                </span>
                <span className="text-[11px] font-semibold text-slate-300 block mt-0.5">
                  {toast.message}
                </span>
              </div>
            )}

            <footer className="bg-slate-900 text-slate-400 py-6 text-center text-[10px] border-t border-slate-800">
              <span className="text-indigo-400 font-black uppercase tracking-wider block">
                LRC Enterprise V11.6.1 - Durable Objects Architecture & Session
                Sync
              </span>
              <p className="font-semibold mt-1">
                &copy; 2026 Production & PMO Control System. All Rights
                Reserved.
              </p>
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
