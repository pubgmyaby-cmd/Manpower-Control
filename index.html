      const formatShortDate = (dateStr) => {
        if (!dateStr) return "";
        const parts = dateStr.split("-");
        if (parts.length < 3) return dateStr;
        const y = parts[0],
          m = parts[1],
          d = parts[2];
        const months = {
          "01": "Jan",
          "02": "Feb",
          "03": "Mar",
          "04": "Apr",
          "05": "Mei",
          "06": "Jun",
          "07": "Jul",
          "08": "Agt",
          "09": "Sep",
          10: "Okt",
          11: "Nov",
          12: "Des",
        };
        return `${parseInt(d, 10)} ${months[m] || m}`;
      };

      const generateWeeksForDateRange = (startDate, endDate) => {
        const weeks = [];
        let d = new Date(startDate);

        const day = d.getDay();
        const diff = d.getDate() - (day === 0 ? 6 : day - 1);
        d.setDate(diff);

        const monthNames = [
          "Januari",
          "Februari",
          "Maret",
          "April",
          "Mei",
          "Juni",
          "Juli",
          "Agustus",
          "September",
          "Oktober",
          "November",
          "Desember",
        ];
        const weekNumCounter = {};

        while (d <= endDate) {
          try {
            const yStr = String(d.getFullYear());
            const mStr = String(d.getMonth() + 1).padStart(2, "0");
            const dayStr = String(d.getDate()).padStart(2, "0");
            const dateStr = `${yStr}-${mStr}-${dayStr}`;
            const mName = monthNames[d.getMonth()];
            const mShort = mName.substring(0, 3);

            const monthKey = `${yStr}-${mStr}`;
            weekNumCounter[monthKey] = (weekNumCounter[monthKey] || 0) + 1;
            const currentWeekNumInMonth = weekNumCounter[monthKey];

            weeks.push({
              id: `W_${dateStr}`,
              weekNum: currentWeekNumInMonth,
              weekLabel: `W${currentWeekNumInMonth} ${mShort}`,
              date: dateStr,
              month: mName,
              year: yStr,
              formattedDate: formatShortDate(dateStr),
            });
          } catch (err) {
            break;
          }

          d.setDate(d.getDate() + 7);
        }
        return weeks;
      };

          const onUserActivity = () => resetInactivityLogoutTimer();

          activityEvents.forEach((evt) =>
            window.addEventListener(evt, onUserActivity, { passive: true }),
          );
          resetInactivityLogoutTimer();

          return () => {
            activityEvents.forEach((evt) =>
              window.removeEventListener(evt, onUserActivity),
            );
            if (autoLogoutTimerRef.current)
              clearTimeout(autoLogoutTimerRef.current);
          };
        }, [currentUser]);

        const addNetworkLog = (passName, status, details) => {
          const timestamp = new Date().toLocaleTimeString();
          setNetworkLogs((prev) => [
            { timestamp, passName, status, details },
            ...(prev || []).slice(0, 29),
          ]);
        };

        const resetLockInactivityTimer = () => {
          if (lockTimeoutTimerRef.current)
            clearTimeout(lockTimeoutTimerRef.current);
          lockTimeoutTimerRef.current = setTimeout(() => {
            if (activeEditCell?.lockKey) {
              releaseLock(activeEditCell.lockKey);
              setActiveEditCell(null);
              triggerAlert(
                "⏱️ Waktu Edit Habis (30 Detik)",
                "Kunci field telah dilepas secara otomatis karena tidak ada aktivitas.",
                "info",
              );
            } else if (activePlotCell?.lockKey) {
              releaseLock(activePlotCell.lockKey);
              setActivePlotCell(null);
              triggerAlert(
                "⏱️ Waktu Plotting Habis (30 Detik)",
                "Kunci cell plotting telah dilepas secara otomatis karena tidak ada aktivitas.",
                "info",
              );
            }
          }, 30000);
        };

        const requestLock = (lockKey) => {
          if (isGuest) return false;
          const currentLock = activeLocks[lockKey];
          if (currentLock && currentLock.userCode !== currentUser.code) {
            triggerAlert(
              "🔒 Field Sedang Terkunci!",
              `Field ini sedang diedit oleh [${currentLock.userLabel || currentLock.userCode}]. Silakan tunggu hingga selesai.`,
              "error",
            );
            return false;
          }

          setActiveLocks((prev) => ({
            ...prev,
            [lockKey]: {
              userCode: currentUser.code,
              userLabel: currentUser.label,
              timestamp: Date.now(),
            },
          }));

          if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
            wsRef.current.send(
              JSON.stringify({
                type: "acquire_lock",
                lockKey,
                userCode: currentUser.code,
                userLabel: currentUser.label,
              }),
            );
          }
          resetLockInactivityTimer();
          return true;
        };

        const releaseLock = (lockKey) => {
          if (!lockKey) return;
          setActiveLocks((prev) => {
            const next = { ...prev };
            delete next[lockKey];
            return next;
          });

          if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
            wsRef.current.send(
              JSON.stringify({
                type: "release_lock",
                lockKey,
                userCode: currentUser.code,
              }),
            );
          }
          if (lockTimeoutTimerRef.current)
            clearTimeout(lockTimeoutTimerRef.current);
        };

        const triggerForceKickThisDevice = (targetUserLabel) => {
          if (activeEditCell?.lockKey) releaseLock(activeEditCell.lockKey);
          if (activePlotCell?.lockKey) releaseLock(activePlotCell.lockKey);
          setActiveEditCell(null);
          setActivePlotCell(null);

          pendingPushRef.current = false;

          const guestUser = {
            role: "Guest",
            code: "guest",
            label: "Tamu (Hanya Baca)",
          };
          setCurrentUser(guestUser);
          currentUserRef.current = guestUser;
          localStorage.removeItem("lrc_current_user");

          if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
            setCfStatus("connected");
            wsRef.current.send(
              JSON.stringify({
                type: "register_session",
                userCode: "guest",
                userLabel: "Tamu",
                sessionId: mySessionId,
              }),
            );
            wsRef.current.send(
              JSON.stringify({
                type: "pull_data",
                userCode: "guest",
                force: true,
              }),
            );
          }

          triggerAlert(
            "🚨 Sesi Dikeluarkan!",
            `Akun [${targetUserLabel || currentUserRef.current.label}] telah dibuka di perangkat lain. Sesi Anda dialihkan ke Mode Tamu & data disinkronkan ulang secara otomatis.`,
            "error",
          );
        };

        const connectWebSocket = (forcePull = false) => {
          if (
            wsRef.current &&
            (wsRef.current.readyState === WebSocket.OPEN ||
              wsRef.current.readyState === WebSocket.CONNECTING)
          ) {
            if (wsRef.current.readyState === WebSocket.OPEN && forcePull) {
              wsRef.current.send(
                JSON.stringify({
                  type: "pull_data",
                  userCode: currentUserRef.current.code,
                  force: true,
                }),
              );
              addNetworkLog(
                "WebSocket",
                "PULL",
                "Meminta sinkronisasi ulang data server secara manual.",
              );
            }
            return;
          }

          setCfStatus("syncing");
          const fullWsUrl = `${WEBSOCKET_URL}?room=${encodeURIComponent(APP_ID)}&userCode=${encodeURIComponent(currentUserRef.current.code)}&sessionId=${encodeURIComponent(mySessionId)}`;

          try {
            const ws = new WebSocket(fullWsUrl);

            ws.onopen = () => {
              setCfStatus("connected");
              const timeStr = new Date().toLocaleTimeString();
              setLastCfSync(timeStr);
              localStorage.setItem("lrc_last_cf_sync", timeStr);
              addNetworkLog(
                "WebSocket",
                "SUCCESS",
                "Tersambung ke Durable Object RAM Layer.",
              );

              ws.send(
                JSON.stringify({
                  type: "register_session",
                  userCode: currentUserRef.current.code,
                  userLabel: currentUserRef.current.label,
                  sessionId: mySessionId,
                }),
              );

              ws.send(
                JSON.stringify({
                  type: "pull_data",
                  userCode: currentUserRef.current.code,
                  force: true,
                }),
              );
            };

            ws.onmessage = (event) => {
              try {
                const data = JSON.parse(event.data);

                if (data.type === "force_kick") {
                  triggerForceKickThisDevice(currentUserRef.current.label);
                  return;
                } else if (data.type === "lock_acquired") {
                  setActiveLocks((prev) => ({
                    ...prev,
                    [data.lockKey]: {
                      userCode: data.userCode,
                      userLabel: data.userLabel,
                      timestamp: Date.now(),
                    },
                  }));
                  addNetworkLog(
                    "Pessimistic Lock",
                    "LOCKED",
                    `Field [${data.lockKey}] dikunci oleh ${data.userLabel} (${data.userCode})`,
                  );
                } else if (data.type === "lock_released") {
                  setActiveLocks((prev) => {
                    const next = { ...prev };
                    delete next[data.lockKey];
                    return next;
                  });
                  addNetworkLog(
                    "Pessimistic Lock",
                    "RELEASED",
                    `Kunci [${data.lockKey}] dilepas oleh ${data.userCode}`,
                  );
                } else if (data.type === "sync_locks") {
                  setActiveLocks(data.locks || {});
                } else if (data.type === "lock_failed") {
                  triggerAlert(
                    "🔒 Cell Terkunci!",
                    `Field ini sedang di-edit oleh [${data.heldByLabel || data.heldBy}]. Mohon tunggu hingga mereka selesai.`,
                    "error",
                  );
                } else if (data.type === "sync" || data.type === "init") {
                  const unpacked = data.payload;
                  if (unpacked) {
                    if (currentUserRef.current.code !== "guest") {
                      const activeSessionForMyUser =
                        data.activeSessions?.[currentUserRef.current.code] ||
                        unpacked.sessions?.[currentUserRef.current.code];
                      if (
                        activeSessionForMyUser &&
                        activeSessionForMyUser !== mySessionId
                      ) {
                        triggerForceKickThisDevice(
                          currentUserRef.current.label,
                        );
                        return;
                      }
                    }

                    const isEditing =
                      activeEditCell !== null || activePlotCell !== null;
                    const isInitial = !isInitialPullDoneRef.current;

                    if (
                      isInitial ||
                      data.force ||
                      !pendingPushRef.current ||
                      !isEditing
                    ) {
                      setLastSavedTimestamp(unpacked.lastUpdated || Date.now());
                      lastSavedTimestampRef.current =
                        unpacked.lastUpdated || Date.now();
                      isInitialPullDoneRef.current = true;
                      applyLoadedData(unpacked, true);
                      addNetworkLog(
                        "Data Sync",
                        "APPLIED",
                        "Data server disinkronkan sebagai Single Source of Truth.",
                      );
                    }
                  }
                }
              } catch (e) {
                console.error("Error parsing WS message:", e);
              }
            };

            ws.onclose = () => {
              setCfStatus("offline");
              addNetworkLog(
                "WebSocket",
                "CLOSED",
                "Koneksi terputus. Mencoba reconnect...",
              );
              clearTimeout(reconnectTimeoutRef.current);
              reconnectTimeoutRef.current = setTimeout(
                () => connectWebSocket(),
                3000,
              );
            };

            ws.onerror = () => {
              setCfStatus("error");
              addNetworkLog(
                "WebSocket",
                "ERROR",
                "Gagal terhubung ke Durable Object.",
              );
            };

            wsRef.current = ws;
          } catch (error) {
            setCfStatus("error");
            addNetworkLog(
              "WebSocket",
              "BLOCKED",
              "Koneksi terhambat oleh browser sandbox.",
            );
          }
        };

        useEffect(() => {
          const handleVisibilityChange = () => {
            if (document.visibilityState === "visible") {
              connectWebSocket(true);
            }
          };

          const handleOnline = () => {
            connectWebSocket(true);
          };

          document.addEventListener("visibilitychange", handleVisibilityChange);
          window.addEventListener("online", handleOnline);

          return () => {
            document.removeEventListener(
              "visibilitychange",
              handleVisibilityChange,
            );
            window.removeEventListener("online", handleOnline);
          };
        }, []);

        const triggerD1Sync = (
          forcePull = false,
          isSilent = false,
          explicitPush = false,
        ) => {
          if (!wsRef.current || wsRef.current.readyState !== WebSocket.OPEN) {
            if (!isSilent)
              triggerToast("Offline", "Koneksi WebSocket terputus.", "info");
            return;
          }

          const currentUserCode = currentUserRef.current.code;
          if (currentUserCode === "guest" && !forcePull) return;

          if (explicitPush || pendingPushRef.current) {
            const currentTS = Date.now();
            const safePayload = {
              ...stateRef.current,
              lastUpdated: currentTS,
              updatedBy: currentUserCode,
            };

            wsRef.current.send(
              JSON.stringify({
                type: "sync_update",
                payload: safePayload,
                sessionId: mySessionId,
                userCode: currentUserCode,
              }),
            );

            pendingPushRef.current = false;
            setLastSavedTimestamp(currentTS);
            lastSavedTimestampRef.current = currentTS;
            addNetworkLog(
              "WebSocket",
              "PUSH",
              "Data & Sesi dikirim ke DO Server.",
            );
          } else if (forcePull) {
            wsRef.current.send(
              JSON.stringify({
                type: "pull_data",
                userCode: currentUserCode,
                force: true,
              }),
            );
          }
        };

        useEffect(() => {
          try {
            const stored = localStorage.getItem("mp_v11_json_database");
            if (stored) {
              const parsed = JSON.parse(stored);
              if (parsed?.payload) {
                applyLoadedData(parsed.payload, false);
                return;
              }
            }
            applyLoadedData(
              {
                projects: DEFAULT_PROJECTS,
                cells: DEFAULT_CELLS,
                pmoList: DEFAULT_PMOS,
                members: DEFAULT_MEMBERS,
                holidays: NATIONAL_HOLIDAYS_DEFAULT,
                requirements: {},
                plotting: {},
                sessions: {},
                projectProgress: {},
                users: DEFAULT_USERS_CONFIG,
                standardCosts: DEFAULT_STANDARD_COSTS,
                actualManHours: {
                  Januari: 4100,
                  Februari: 3950,
                  Maret: 4200,
                  April: 3800,
                  Mei: 4500,
                  Juni: 5200,
                  Juli: 0,
                  Agustus: 0,
                  September: 0,
                  Oktober: 0,
                  November: 0,
                  Desember: 0,
                },
              },
              true,
            );
          } catch (err) {}
        }, []);

        const applyLoadedData = (payload, save = true) => {
          setProjects(payload.projects || []);
          setCells(payload.cells || DEFAULT_CELLS);
          setPmoList(payload.pmoList || DEFAULT_PMOS);
          setMembers(payload.members || {});
          setHolidays(payload.holidays || []);
          setRequirements(payload.requirements || {});
          setPlotting(payload.plotting || {});
          setSessions(payload.sessions || {});
          setProjectProgress(payload.projectProgress || {});
          setUsers(payload.users || DEFAULT_USERS_CONFIG);
          setStandardCosts(payload.standardCosts || DEFAULT_STANDARD_COSTS);
          setActualManHours(payload.actualManHours || {});
          if (save) saveDatabaseOffline(payload, false);
        };

        const saveDatabaseOffline = (newData, triggerPush = true) => {
          const currentTimestamp = Date.now();
          if (triggerPush) {
            pendingPushRef.current = true;
          }

          const payloadToSave = {
            ...(newData || stateRef.current),
            lastUpdated: currentTimestamp,
            updatedBy: currentUserRef.current.code,
          };

          localStorage.setItem(
            "mp_v11_json_database",
            JSON.stringify({
              metadata: {
                version: DB_VERSION,
                timestamp: new Date().toISOString(),
                appId: APP_ID,
              },
              payload: payloadToSave,
            }),
          );

          setLastSavedTimestamp(currentTimestamp);
          lastSavedTimestampRef.current = currentTimestamp;

          if (triggerPush && currentUserRef.current.code !== "guest") {
            if (pushDebounceTimerRef.current)
              clearTimeout(pushDebounceTimerRef.current);

            pushDebounceTimerRef.current = setTimeout(() => {
              triggerD1Sync(false, true, true);
            }, 2500);
          }
        };

        const handleLocalDataChange = () => {
          if (currentUserRef.current.code === "guest") {
            triggerAlert(
              "Akses Terbatas",
              "Anda harus login untuk memodifikasi data.",
              "error",
            );
            return;
          }
          saveDatabaseOffline(null, true);
        };

        useEffect(() => {
          const handleBeforeUnload = (e) => {
            if (
              pendingPushRef.current &&
              currentUserRef.current.code !== "guest"
            ) {
              saveDatabaseOffline(null, false);

              if (
                wsRef.current &&
                wsRef.current.readyState === WebSocket.OPEN
              ) {
                const currentTS = Date.now();
                wsRef.current.send(
                  JSON.stringify({
                    type: "sync_update",
                    payload: {
                      ...stateRef.current,
                      lastUpdated: currentTS,
                      updatedBy: currentUserRef.current.code,
                    },
                    sessionId: mySessionId,
                    userCode: currentUserRef.current.code,
                  }),
                );
                pendingPushRef.current = false;
              }

              const msg =
                "Ada perubahan data yang belum tersinkronisasi ke server. Yakin ingin memuat ulang/meninggalkan halaman?";
              e.preventDefault();
              e.returnValue = msg;
              return msg;
            }
          };
          window.addEventListener("beforeunload", handleBeforeUnload);
          return () =>
            window.removeEventListener("beforeunload", handleBeforeUnload);
        }, []);

        useEffect(() => {
          const autoSyncTimer = setInterval(() => {
            if (
              pendingPushRef.current &&
              wsRef.current &&
              wsRef.current.readyState === WebSocket.OPEN &&
              currentUserRef.current.code !== "guest"
            ) {
              triggerD1Sync(false, true, true);
              addNetworkLog(
                "Auto-Save",
                "SYNCED",
                "Batch perubahan tertunda diamankan ke DO Server.",
              );
            }
          }, 15000);
          return () => clearInterval(autoSyncTimer);
        }, []);

        const triggerToast = (title, message, type = "info") => {
          setToast({ show: true, title, message, type });
          setTimeout(
            () => setToast((prev) => ({ ...prev, show: false })),
            3000,
          );
        };

        const triggerAlert = (title, message, type = "info") =>
          setAlertBox({ show: true, title, message, type });

        const triggerConfirm = (
          title,
          message,
          callback,
          onCancel = null,
          confirmText = "Konfirmasi",
          cancelText = "Batal",
        ) =>
          setConfirmBox({
            show: true,
            title,
            message,
            onConfirm: () => {
              callback();
              setConfirmBox({
                show: false,
                title: "",
                message: "",
                onConfirm: null,
                onCancel: null,
              });
            },
            onCancel: () => {
              if (onCancel) onCancel();
              setConfirmBox({
                show: false,
                title: "",
                message: "",
                onConfirm: null,
                onCancel: null,
              });
            },
            confirmText,
            cancelText,
          });

        const isGuest = currentUser.code === "guest";
        const isSuperuser = currentUser.role === "Superuser";
        const isSuperuserOrPmoGeneral =
          currentUser.role === "Superuser" ||
          currentUser.role === "PMO General";

        const canEditCell = (cellCode) => {
          if (isGuest) return false;
          if (isSuperuserOrPmoGeneral) return true;
          return (
            currentUser.role === `${cellCode} Cell Leader` ||
            currentUser.code.toUpperCase() === cellCode.toUpperCase()
          );
        };

        const canManageHolidays = () => !isGuest && isSuperuserOrPmoGeneral;

        const canEditProjectProgress = (project) => {
          if (isGuest) return false;
          if (isSuperuserOrPmoGeneral) return true;
          return (
            currentUser.role === `PMO - ${project.pmo}` ||
            currentUser.role === `PMO ${project.pmo}`
          );
        };

        const getCurrentUserCell = () => {
          if (isSuperuser || currentUser.role.startsWith("PMO")) return "ALL";
          const match = currentUser.role.match(
            /^([A-Z0-9]+)\s+Cell\s+Leader$/i,
          );
          return match ? match[1].toUpperCase() : "ALL";
        };

        const getCurrentUserPmo = () => {
          if (isSuperuser || currentUser.role === "PMO General") return "ALL";
          return currentUser.role.startsWith("PMO")
            ? currentUser.role.split(" ")[1].toUpperCase()
            : "ALL";
        };

        const getFilteredProjects = () =>
          hideClosedProjects
            ? projects.filter(
                (p) => p.status === "Open" || p.status === "Active",
              )
            : projects;

        const getPlottingFilteredProjects = () => {
          const bp = getFilteredProjects();
          const uc = getCurrentUserCell();
          return uc === "ALL"
            ? bp
            : bp.filter((p) =>
                [p.engMech, p.engElec, p.mech, p.elec].includes(uc),
              );
        };

        const getTimelineFilteredProjects = () => {
          const bp = getFilteredProjects();
          const up = getCurrentUserPmo();
          return up === "ALL" ? bp : bp.filter((p) => p.pmo === up);
        };

        const getThreeMonthsRange = () => {
          const monthNames = [
            "Januari",
            "Februari",
            "Maret",
            "April",
            "Mei",
            "Juni",
            "Juli",
            "Agustus",
            "September",
            "Oktober",
            "November",
            "Desember",
          ];
          const now = new Date();
          return [
            monthNames[now.getMonth()],
            monthNames[(now.getMonth() + 1) % 12],
            monthNames[(now.getMonth() + 2) % 12],
          ];
        };

        const getWeeksForStats = () => {
          const targetMonths = getThreeMonthsRange();
          const bw = decoratedWeeks.filter((w) =>
            targetMonths.includes(w.month),
          );
          if (selectedMonthFilter === "ALL") return bw;
          return bw.filter((w) => w.month === selectedMonthFilter);
        };

        const calculateManHours = (wd, we) => wd * 5 * 8 + we * 2 * 8;

        // Helper untuk requirement target: alokasi kini dipecah jadi 2 field terpisah,
        // pct_wd_req (Alokasi WD, >100% = overtime) dan pct_we_req (Alokasi WE, SELALU
        // dihitung sebagai overtime penuh karena kerja weekend pada dasarnya adalah OT).
        // wd_req/we_req yang disimpan tetap nilai nominal MP yang diketik user; nilai
        // EFEKTIF (yang dipakai utk manhours/cost) adalah nominal * pct / 100.
        // Fallback ke pct_req (field lama, sebelum split) untuk data lama yang belum
        // punya pct_wd_req/pct_we_req, agar tetap backward-compatible.
        const getReqPctWd = (req) =>
          req && typeof req.pct_wd_req === "number"
            ? req.pct_wd_req
            : req && typeof req.pct_req === "number"
              ? req.pct_req
              : 100;
        const getReqPctWe = (req) =>
          req && typeof req.pct_we_req === "number"
            ? req.pct_we_req
            : req && typeof req.pct_req === "number"
              ? req.pct_req
              : 100;
        // Dipertahankan untuk kompatibilitas kode lama yang masih memanggil getReqPct
        // (mis. untuk keperluan tampilan ringkas) — merujuk ke alokasi WD.
        const getReqPct = (req) => getReqPctWd(req);
        const getEffectiveReq = (req) => {
          if (!req)
            return {
              wd: 0,
              we: 0,
              pctWd: 100,
              pctWe: 100,
              wdIsOT: false,
              weIsOT: false,
            };
          const pctWd = getReqPctWd(req);
          const pctWe = getReqPctWe(req);
          const we = (req.we_req || 0) * (pctWe / 100);
          return {
            wd: (req.wd_req || 0) * (pctWd / 100),
            we,
            pctWd,
            pctWe,
            // WD hanya OT untuk bagian yang melebihi 100%.
            wdIsOT: pctWd > 100,
            // WE selalu dianggap overtime penuh selama ada alokasi WE (>0).
            weIsOT: we > 0,
          };
        };

        // Helper untuk jam aktual bulanan (realisasi): sekarang mendukung
        // breakdown overtime Project & Non-Project, disimpan sebagai object
        // { base, otProject, otNonProject }. Data lama (angka polos) tetap
        // dibaca sebagai jam non-OT (base) agar backward-compatible.
        const getActualEntry = (m) => {
          const v = actualManHours[m];
          if (v && typeof v === "object") {
            return {
              base: v.base || 0,
              otProject: v.otProject || 0,
              otNonProject: v.otNonProject || 0,
            };
          }
          return { base: v || 0, otProject: 0, otNonProject: 0 };
        };

        const isDateHoliday = (dateStr) =>
          holidays.some((h) => h.date === dateStr);

        const getHolidaysInWeek = (weekStartStr) => {
          const start = new Date(weekStartStr);
          let count = 0;
          for (let i = 0; i < 5; i++) {
            const current = new Date(start);
            current.setDate(start.getDate() + i);
            if (isDateHoliday(current.toISOString().split("T")[0])) count++;
          }
          return count;
        };

        const calculateVendorMetrics = () => {
          const sw = getWeeksForStats();
          let details = {
            Mechanic: { wdm: 0, wem: 0, cost: 0 },
            Electric: { wdm: 0, wem: 0, cost: 0 },
            Program: { wdm: 0, wem: 0, cost: 0 },
          };
          getFilteredProjects().forEach((p) => {
            Object.keys(plotting[p.id] || {}).forEach((rid) => {
              const rConf = ROLE_CONFIGS.find((r) => r.id === rid);
              const cat = rConf ? rConf.category : "Mechanic";
              const owner = p[rConf?.picField] || "HLM";
              if (selectedCellFilter !== "ALL" && selectedCellFilter !== owner)
                return;
              sw.forEach((w) => {
                const activeWeekdays = Math.max(
                  0,
                  5 - getHolidaysInWeek(w.date),
                );
                (plotting[p.id][rid]?.[w.id] || []).forEach((plot) => {
                  if (plot.isVendor || plot.member === "VND") {
                    details[cat].wdm += (plot.wd_plot / 100) * activeWeekdays;
                    details[cat].wem += (plot.we_plot / 100) * 2;
                  }
                });
              });
            });
          });
          Object.keys(details).forEach((cat) => {
            const wdRate = standardCosts[cat]?.weekday || 0;
            const weRate = standardCosts[cat]?.weekend || 0;
            details[cat].cost =
              details[cat].wdm * wdRate + details[cat].wem * weRate;
          });
          return {
            details,
            totalCost:
              details.Mechanic.cost +
              details.Electric.cost +
              details.Program.cost,
          };
        };

        const getVendorHeadcountStats = () => {
          const sw = getWeeksForStats();
          let uniqueV = new Set();
          let totalM = 0;
          getFilteredProjects().forEach((p) => {
            Object.keys(plotting[p.id] || {}).forEach((rid) => {
              sw.forEach((w) => {
                (plotting[p.id][rid]?.[w.id] || []).forEach((plot) => {
                  if (plot.isVendor || plot.member === "VND") {
                    uniqueV.add(plot.member);
                    totalM += ((plot.wd_plot || 0) + (plot.we_plot || 0)) / 100;
                  }
                });
              });
            });
          });
          return { uniqueCount: uniqueV.size, totalMandays: totalM.toFixed(1) };
        };

        const getProjectVendorCost = (projId) => {
          const sw = getWeeksForStats();
          let cost = 0,
            count = 0;
          Object.keys(plotting[projId] || {}).forEach((rid) => {
            const cat =
              ROLE_CONFIGS.find((r) => r.id === rid)?.category || "Mechanic";
            const wdRate = standardCosts[cat]?.weekday || 0;
            const weRate = standardCosts[cat]?.weekend || 0;
            sw.forEach((w) => {
              const activeWeekdays = Math.max(0, 5 - getHolidaysInWeek(w.date));
              (plotting[projId][rid]?.[w.id] || []).forEach((plot) => {
                if (plot.isVendor || plot.member === "VND") {
                  count++;
                  cost +=
                    (plot.wd_plot / 100) * activeWeekdays * wdRate +
                    (plot.we_plot / 100) * 2 * weRate;
                }
              });
            });
          });
          return { cost, countVendor: count };
        };

        const getProjectMHReport = (projId) => {
          const sw = getWeeksForStats();
          let total = 0,
            internal = 0,
            vendor = 0;
          Object.keys(plotting[projId] || {}).forEach((rid) => {
            sw.forEach((w) => {
              (plotting[projId][rid]?.[w.id] || []).forEach((plot) => {
                const mh = calculateManHours(
                  plot.wd_plot / 100,
                  plot.we_plot / 100,
                );
                total += mh;
                if (plot.isVendor || plot.member === "VND") vendor += mh;
                else internal += mh;
              });
            });
          });
          return { totalMH: total, internalMH: internal, vendorMH: vendor };
        };

        const getSummaryMetrics = () => {
          let wdOver = 0,
            weOver = 0,
            totalP = 0;
          const sw = getWeeksForStats();
          const activeProjects = getFilteredProjects();

          sw.forEach((w) => {
            const activeCells =
              selectedCellFilter === "ALL"
                ? cells.map((c) => c.code)
                : [selectedCellFilter];
            const list = [];
            activeCells.forEach((c) => list.push(...(members[c] || [])));
            const normWd = Math.max(0, 5 - getHolidaysInWeek(w.date)) / 5;
            list.forEach((m) => {
              let mwd = 0,
                mwe = 0;
              activeProjects.forEach((p) => {
                ROLE_CONFIGS.forEach((r) => {
                  (plotting[p.id]?.[r.id]?.[w.id] || []).forEach((plot) => {
                    if (
                      plot.member === m.id &&
                      !plot.isVendor &&
                      plot.member !== "VND"
                    ) {
                      mwd += (plot.wd_plot || 0) / 100;
                      mwe += (plot.we_plot || 0) / 100;
                    }
                  });
                });
              });
              if (mwd > normWd) wdOver += mwd - normWd;
              weOver += mwe;
            });
          });

          activeProjects.forEach((p) => {
            Object.keys(plotting[p.id] || {}).forEach((rid) => {
              const owner =
                p[ROLE_CONFIGS.find((r) => r.id === rid)?.picField] || "HLM";
              if (
                selectedCellFilter === "ALL" ||
                selectedCellFilter === owner
              ) {
                sw.forEach((w) => {
                  (plotting[p.id][rid]?.[w.id] || []).forEach((plot) => {
                    if (!plot.isVendor && plot.member !== "VND") {
                      totalP += calculateManHours(
                        plot.wd_plot / 100,
                        plot.we_plot / 100,
                      );
                    }
                  });
                });
              }
            });
          });
          return {
            weekdayOvertime: wdOver,
            weekendOvertime: weOver,
            plottedHours: totalP,
          };
        };

        const calculateMonthlyProjection = () => {
          const months = [
            "Januari",
            "Februari",
            "Maret",
            "April",
            "Mei",
            "Juni",
            "Juli",
            "Agustus",
            "September",
            "Oktober",
            "November",
            "Desember",
          ];
          let filtered = months;
          if (monthlyPeriodSlicer === "Semester1")
            filtered = months.slice(0, 6);
          else if (monthlyPeriodSlicer === "Semester2")
            filtered = months.slice(6);
          else if (monthlyPeriodSlicer === "Q3")
            filtered = ["Juli", "Agustus", "September"];

          let targetMembers = [];
          if (selectedCellFilter === "ALL") {
            targetMembers = Object.values(members).flat();
          } else {
            targetMembers = members[selectedCellFilter] || [];
          }
          const memberCount = Math.max(1, targetMembers.length);
          const activeProjects = getFilteredProjects();

          return filtered.map((m) => {
            const mWeeks = decoratedWeeks.filter((w) => w.month === m);
            let cap = 0,
              projectedWorkload = 0,
              projectedOTWorkload = 0;
            mWeeks.forEach((w) => {
              const activeWd = Math.max(0, 5 - getHolidaysInWeek(w.date));
              cap += memberCount * activeWd * 8;

              activeProjects.forEach((p) => {
                ROLE_CONFIGS.forEach((r) => {
                  const cellOwner = p[r.picField] || "HLM";
                  if (
                    selectedCellFilter !== "ALL" &&
                    selectedCellFilter !== cellOwner
                  )
                    return;

                  const plots = plotting[p.id]?.[r.id]?.[w.id] || [];
                  const req = requirements[p.id]?.[r.id]?.[w.id];

                  if (plots.length > 0) {
                    plots.forEach((plot) => {
                      if (!plot.isVendor && plot.member !== "VND") {
                        projectedWorkload += calculateManHours(
                          plot.wd_plot / 100,
                          plot.we_plot / 100,
                        );
                      }
                    });
                  } else if (req) {
                    const effReq = getEffectiveReq(req);
                    projectedWorkload += calculateManHours(
                      effReq.wd,
                      effReq.we,
                    );
                  }

                  // Overtime Requirement Planning: akumulasi dari alokasi WD
                  // yang >100% (kelebihan di atas 100%) DAN seluruh alokasi
                  // WE (selalu OT). Dihitung langsung dari data requirement
                  // target itu sendiri (bukan dari plotting aktual), terlepas
                  // apakah minggu tsb sudah diplot atau belum.
                  if (req) {
                    const effReq = getEffectiveReq(req);
                    const otWd = effReq.wdIsOT
                      ? ((req.wd_req || 0) * (effReq.pctWd - 100)) / 100
                      : 0;
                    projectedOTWorkload += calculateManHours(otWd, effReq.we);
                  }
                });
              });
            });
            const lRate = cap > 0 ? (projectedWorkload / cap) * 100 : 0;
            const otRate = cap > 0 ? (projectedOTWorkload / cap) * 100 : 0;

            const actEntry = getActualEntry(m);
            const act = actEntry.base;
            const actOtTotal = actEntry.otProject + actEntry.otNonProject;
            return {
              month: m,
              capacityHours: cap,
              plottedHours: projectedWorkload,
              loadingRate: lRate,
              otWorkload: projectedOTWorkload,
              otLoadingRate: otRate,
              actualHours: act,
              actualLoadingRate: cap > 0 ? (act / cap) * 100 : 0,
              actualOtProjectHours: actEntry.otProject,
              actualOtNonProjectHours: actEntry.otNonProject,
              actualOtHours: actOtTotal,
              actualOtLoadingRate: cap > 0 ? (actOtTotal / cap) * 100 : 0,
              actualOtProjectRate:
                cap > 0 ? (actEntry.otProject / cap) * 100 : 0,
              actualOtNonProjectRate:
                cap > 0 ? (actEntry.otNonProject / cap) * 100 : 0,
            };
          });
        };

        const getTopDiagnosticInsights = () => {
          let sw = getWeeksForStats();
          if (utilizationFilter === "THIS_WEEK") {
            const todayWId = getTodayWeekId();
            sw = decoratedWeeks.filter((w) => w.id === todayWId);
          } else if (utilizationFilter === "THIS_MONTH") {
            const currentMonthName = [
              "Januari",
              "Februari",
              "Maret",
              "April",
              "Mei",
              "Juni",
              "Juli",
              "Agustus",
              "September",
              "Oktober",
              "November",
              "Desember",
            ][new Date().getMonth()];
            sw = decoratedWeeks.filter((w) => w.month === currentMonthName);
          } else if (utilizationFilter === "NEXT_MONTH") {
            const nextMonthName = [
              "Januari",
              "Februari",
              "Maret",
              "April",
              "Mei",
              "Juni",
              "Juli",
              "Agustus",
              "September",
              "Oktober",
              "November",
              "Desember",
            ][(new Date().getMonth() + 1) % 12];
            sw = decoratedWeeks.filter((w) => w.month === nextMonthName);
          }

          const allM = Object.values(members).flat();
          const activeProjects = getFilteredProjects();

          const aggregates = allM.map((m) => {
            let plotted = 0,
              cap = 0;
            sw.forEach((w) => {
              cap += Math.max(0, 5 - getHolidaysInWeek(w.date)) * 8;
              activeProjects.forEach((p) => {
                ROLE_CONFIGS.forEach((r) => {
                  (plotting[p.id]?.[r.id]?.[w.id] || []).forEach((plot) => {
                    if (
                      plot.member === m.id &&
                      !plot.isVendor &&
                      plot.member !== "VND"
                    ) {
                      plotted += calculateManHours(
                        plot.wd_plot / 100,
                        plot.we_plot / 100,
                      );
                    }
                  });
                });
              });
            });
            const cellCode =
              Object.keys(members).find((c) =>
                members[c].some((mem) => mem.id === m.id),
              ) || "N/A";
            return {
              id: m.id,
              cell: cellCode,
              loadingPercent: cap > 0 ? (plotted / cap) * 100 : 0,
              plotted,
              capacity: cap,
            };
          });
          const ov = [...aggregates]
            .filter((m) => m.loadingPercent > 100)
            .sort((a, b) => b.loadingPercent - a.loadingPercent);
          return {
            topLoads:
              ov.length > 0
                ? ov.slice(0, 6)
                : [...aggregates]
                    .sort((a, b) => b.loadingPercent - a.loadingPercent)
                    .slice(0, 6),
            underloaded: [...aggregates]
              .sort((a, b) => a.loadingPercent - b.loadingPercent)
              .slice(0, 6),
          };
        };

        const getActionableWarnings = () => {
          const todayStr = getTodayStr();
          const activeProjects = getFilteredProjects();

          const pmoAlerts = [];
          const cellAlerts = [];
          const pmoSet = new Set();
          const cellSet = new Set();

          activeProjects.forEach((p) => {
            let projectHasRequirements = false;
            let pmoNeedsAttention = false;

            ROLE_CONFIGS.forEach((role) => {
              const progressVal = projectProgress[p.id]?.[role.phaseKey] || 0;
              let lastTargetWeekDate = null;
              let totalPlannedMH = 0;
              let cumulativePlannedMHToToday = 0;

              decoratedWeeks.forEach((w) => {
                const req = requirements[p.id]?.[role.id]?.[w.id];
                if (req && (req.wd_req > 0 || req.we_req > 0)) {
                  projectHasRequirements = true;
                  if (!lastTargetWeekDate || w.date > lastTargetWeekDate) {
                    lastTargetWeekDate = w.date;
                  }
                  const effReq = getEffectiveReq(req);
                  const weekMH = calculateManHours(effReq.wd, effReq.we);
                  totalPlannedMH += weekMH;
                  if (w.date <= todayStr) {
                    cumulativePlannedMHToToday += weekMH;
                  }
                }
              });

              if (
                lastTargetWeekDate &&
                lastTargetWeekDate < todayStr &&
                progressVal < 100
              ) {
                pmoNeedsAttention = true;
              } else if (totalPlannedMH > 0 && cumulativePlannedMHToToday > 0) {
                const expectedPct = Math.round(
                  (cumulativePlannedMHToToday / totalPlannedMH) * 100,
                );
                if (progressVal < expectedPct) {
                  pmoNeedsAttention = true;
                }
              }

              if (totalPlannedMH > 0 && progressVal === 0) {
                pmoNeedsAttention = true;
              }
            });

            if (!projectHasRequirements) {
              pmoNeedsAttention = true;
            }

            if (pmoNeedsAttention) {
              const pmoKey = `${p.pmo}_${p.id}`;
              if (!pmoSet.has(pmoKey)) {
                pmoSet.add(pmoKey);
                pmoAlerts.push({
                  pmo: p.pmo,
                  copro: p.copro,
                  projName: p.name,
                });
              }
            }
          });

          const upcomingWeeks = decoratedWeeks
            .filter((w) => w.date >= todayStr)
            .slice(0, 8);
          activeProjects.forEach((p) => {
            ROLE_CONFIGS.forEach((role) => {
              const cellOwner = p[role.picField] || "HLM";
              upcomingWeeks.forEach((w) => {
                const req = requirements[p.id]?.[role.id]?.[w.id];
                if (req && (req.wd_req > 0 || req.we_req > 0)) {
                  const plots = plotting[p.id]?.[role.id]?.[w.id] || [];
                  let plottedWd = 0,
                    plottedWe = 0;
                  plots.forEach((pl) => {
                    plottedWd += (pl.wd_plot || 0) / 100;
                    plottedWe += (pl.we_plot || 0) / 100;
                  });
                  const effReq = getEffectiveReq(req);

                  if (
                    plots.length === 0 ||
                    plottedWd < effReq.wd ||
                    plottedWe < effReq.we
                  ) {
                    const cellKey = `${cellOwner}_${p.id}`;
                    if (!cellSet.has(cellKey)) {
                      cellSet.add(cellKey);
                      cellAlerts.push({
                        cell: cellOwner,
                        copro: p.copro,
                        projName: p.name,
                      });
                    }
                  }
                }
              });
            });
          });

          return { pmoAlerts, cellAlerts };
        };

        const getProjectCalculatedStats = (projId) => {
          const progressObj = projectProgress[projId] || {};
          const portions = {
            Design_Mech: 0.2,
            Design_Elec: 0.2,
            Assy: 0.3,
            Install: 0.2,
            PM: 0.1,
          };

          const pDesignMech = progressObj["Design_Mech"] || 0;
          const pDesignElec = progressObj["Design_Elec"] || 0;
          const pAssy = progressObj["Assy"] || 0;
          const pInstall = progressObj["Install"] || 0;
          const pPM = progressObj["PM"] || 0;

          const finalProgress =
            pDesignMech * portions.Design_Mech +
            pDesignElec * portions.Design_Elec +
            pAssy * portions.Assy +
            pInstall * portions.Install +
            pPM * portions.PM;

          let activePhase = "Belum Mulai";
          if (pPM > 0) activePhase = "Production Monitoring";
          else if (pInstall > 0) activePhase = "Install";
          else if (pAssy > 0) activePhase = "Assy";
          else if (pDesignMech > 0 || pDesignElec > 0) activePhase = "Design";

          return { progress: Math.round(finalProgress), phase: activePhase };
        };

        const getTodayWeekId = () => {
          const todayStr = getTodayStr();
          for (let i = 0; i < decoratedWeeks.length; i++) {
            const wStart = decoratedWeeks[i].date;
            const nextStart = decoratedWeeks[i + 1]
              ? decoratedWeeks[i + 1].date
              : "9999-99-99";
            if (todayStr >= wStart && todayStr < nextStart) {
              return decoratedWeeks[i].id;
            }
          }
          return decoratedWeeks[0]?.id || "W_2026-07-06";
        };

        // Helper for Member Control: retrieve all project assignments for a specific member in a given week
        const getMemberWeekAssignments = (memberId, weekId) => {
          const assignments = [];
          getFilteredProjects().forEach((p) => {
            ROLE_CONFIGS.forEach((role) => {
              const plots = plotting[p.id]?.[role.id]?.[weekId] || [];
              plots.forEach((plot) => {
                if (plot.member === memberId) {
                  assignments.push({
                    projId: p.id,
                    copro: p.copro,
                    projName: p.name,
                    pmo: p.pmo,
                    roleName: role.name,
                    cellOwner: p[role.picField] || "HLM",
                    wd_plot: plot.wd_plot || 0,
                    we_plot: plot.we_plot || 0,
                    isVendor: plot.isVendor,
                  });
                }
              });
            });
          });
          return assignments;
        };

        const checkAdoptionStatus = (memberId) => {
          const foundCells = [];
          Object.keys(members).forEach((cellCode) => {
            if (
              members[cellCode] &&
              members[cellCode].some((m) => m.id === memberId)
            ) {
              foundCells.push(cellCode);
            }
          });
          return { isAdopted: foundCells.length > 1, cells: foundCells };
        };

        const calculateWeekOvertimeDetails = (weekId) => {
          const wkObj = decoratedWeeks.find((wk) => wk.id === weekId);
          const hCount = wkObj ? getHolidaysInWeek(wkObj.date) : 0;
          const activeWeekdays = Math.max(0, 5 - hCount);
          const normWd = activeWeekdays / 5;

          const activeProjects = getFilteredProjects();
          const allM = Object.values(members).flat();

          const memberWdTotals = {};
          allM.forEach((m) => {
            let wdSum = 0;
            activeProjects.forEach((p) => {
              ROLE_CONFIGS.forEach((role) => {
                (plotting[p.id]?.[role.id]?.[weekId] || []).forEach((plot) => {
                  if (
                    plot.member === m.id &&
                    !plot.isVendor &&
                    plot.member !== "VND"
                  ) {
                    wdSum += (plot.wd_plot || 0) / 100;
                  }
                });
              });
            });
            memberWdTotals[m.id] = {
              totalWd: wdSum,
              overtimeWd: Math.max(0, wdSum - normWd),
            };
          });

          const projectMap = {};
          let totalWdOvertimeMH = 0;
          let totalWeOvertimeMH = 0;

          activeProjects.forEach((p) => {
            let projMH = 0;
            ROLE_CONFIGS.forEach((role) => {
              (plotting[p.id]?.[role.id]?.[weekId] || []).forEach((plot) => {
                if (
                  plot.member &&
                  plot.member !== "" &&
                  !plot.isVendor &&
                  plot.member !== "VND"
                ) {
                  const mInfo = memberWdTotals[plot.member];
                  const plotWd = (plot.wd_plot || 0) / 100;
                  const plotWe = (plot.we_plot || 0) / 100;

                  let wdOverMH = 0;
                  if (mInfo && mInfo.totalWd > 0 && mInfo.overtimeWd > 0) {
                    const share = plotWd / mInfo.totalWd;
                    wdOverMH = mInfo.overtimeWd * share * activeWeekdays * 8;
                  }

                  const weOverMH = plotWe * 2 * 8;

                  totalWdOvertimeMH += wdOverMH;
                  totalWeOvertimeMH += weOverMH;
                  projMH += wdOverMH + weOverMH;
                }
              });
            });

            if (projMH > 0) {
              if (!projectMap[p.id]) {
                projectMap[p.id] = {
                  id: p.id,
                  copro: p.copro,
                  name: p.name,
                  pmo: p.pmo,
                  overtimeMH: 0,
                };
              }
              projectMap[p.id].overtimeMH += projMH;
            }
          });

          const contributors = Object.values(projectMap)
            .map((c) => ({ ...c, overtimeMH: Math.round(c.overtimeMH) }))
            .filter((c) => c.overtimeMH > 0)
            .sort((a, b) => b.overtimeMH - a.overtimeMH);

          const totalOvertimeMH = Math.round(
            totalWdOvertimeMH + totalWeOvertimeMH,
          );

          return {
            totalOvertimeMH,
            totalWdOvertimeMH: Math.round(totalWdOvertimeMH),
            totalWeOvertimeMH: Math.round(totalWeOvertimeMH),
            contributors,
          };
        };

        const scrollTable = (ref, dir) => {
          if (ref.current)
            ref.current.scrollBy({
              left: dir === "left" ? -350 : 350,
              behavior: "smooth",
            });
        };

        const executeLogin = (user, forceKick = false) => {
          setCurrentUser(user);
          currentUserRef.current = user;
          localStorage.setItem("lrc_current_user", JSON.stringify(user));

          const updatedSessions = {
            ...(stateRef.current.sessions || {}),
            [user.code]: mySessionId,
          };
          setSessions(updatedSessions);
          stateRef.current.sessions = updatedSessions;

          setLoginInputCode("");
          setLoginInputPass("");
          setAuthError("");
          setShowAuthModal(false);

          triggerToast(
            "Berhasil Login",
            `Selamat datang, ${user.label}.`,
            "success",
          );
          saveDatabaseOffline(null, true);

          if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
            setCfStatus("connected");

            const currentTS = Date.now();

              JSON.stringify({
                type: "sync_update",
                payload: {

                  sessions: updatedSessions,
                  lastUpdated: currentTS,
                  updatedBy: user.code,
                },
                sessionId: mySessionId,

        const handleAuthSubmit = (e) => {

          const found = users.find(

              u.pass === loginInputPass.trim(),

                () => {

                "Kick Sesi Lain",
                "Batal Login",

              setShowAuthModal(false);

        };

        const handleLogout = () => {
          if (activeEditCell?.lockKey) releaseLock(activeEditCell.lockKey);
          if (activePlotCell?.lockKey) releaseLock(activePlotCell.lockKey);

          const guestObj = {
            role: "Guest",
            code: "guest",

          if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {

        const handleCellClickTimeline = (projId, roleId, weekId) => {
          if (isGuest) return;
          if (!paintingEnabled) return;
          if (!isSuperuser && !currentUser.role.startsWith("PMO")) {
            triggerAlert(
              "Akses Ditolak",
              "Hanya PMO yang dapat mewarnai target.",
              "error",
            );
            return;
          }

          const lockKey = `req_${projId}_${roleId}_${weekId}`;
          if (!requestLock(lockKey)) return;

          const updated = JSON.parse(JSON.stringify(requirements));
          if (!updated[projId]) updated[projId] = {};
          if (!updated[projId][roleId]) updated[projId][roleId] = {};
          if (updated[projId][roleId][weekId]) {
            const ex = updated[projId][roleId][weekId];
            setActiveEditCell({
              projId,
              roleId,
              weekId,
              wd: ex.wd_req,
              we: ex.we_req,
              pctWd: getReqPctWd(ex),
              pctWe: getReqPctWe(ex),
              phase: ex.phase,
              lockKey,
            });
          } else {
            updated[projId][roleId][weekId] = {
              wd_req: paintWD,
              we_req: paintWE,
              pct_wd_req: paintPctWD,

        const saveInstantRequirement = (
          projId,
          roleId,
          weekId,
          wd,
          we,
          pctWd,
          pctWe,
          phase,
          lockKey,
        ) => {
          const updated = JSON.parse(JSON.stringify(requirements));
          if (!updated[projId]) updated[projId] = {};
          if (!updated[projId][roleId]) updated[projId][roleId] = {};
          const parsedWd = parseFloat(wd) || 0,
            parsedWe = parseFloat(we) || 0;
          let parsedPctWd = parseFloat(pctWd);
          if (isNaN(parsedPctWd)) parsedPctWd = 100;
          parsedPctWd = Math.max(0, parsedPctWd);
          let parsedPctWe = parseFloat(pctWe);
          if (isNaN(parsedPctWe)) parsedPctWe = 100;
          // Alokasi WE tetap bisa <100% (mis. MP hanya bekerja setengah hari
          // weekend), tapi berapa pun besarnya, SELURUH jam WE yang efektif
          // tercatat sebagai overtime (lihat getEffectiveReq -> weIsOT).
          parsedPctWe = Math.max(0, parsedPctWe);
          if (parsedWd <= 0 && parsedWe <= 0) {
            delete updated[projId][roleId][weekId];
          } else {
            updated[projId][roleId][weekId] = {
              wd_req: parsedWd,
              we_req: parsedWe,
              pct_wd_req: parsedPctWd,
              pct_we_req: parsedPctWe,
              phase,
            };
          }
          setRequirements(updated);
          setActiveEditCell(null);
          handleLocalDataChange();

                                : [selectedCellFilter];
                            const activeList = [];
                            activeCells.forEach((c) =>
                              activeList.push(...(members[c] || [])),
                            );
                            const Capacity = Math.max(1, activeList.length);
                            const holidaysCount = getHolidaysInWeek(w.date);
                            const maxNormalWdPerPerson =
                              Math.max(0, 5 - holidaysCount) / 5;

                            let totalNormalWD = 0,
                              totalWeekdayOvertime = 0,
                              totalWeekendOvertime = 0,
                              totalVendorWD = 0,
                              totalVendorWE = 0,
                              totalPmoReq = 0;

                            const activeProjects = getFilteredProjects();

                            activeList.forEach((m) => {
                              let memberWdSum = 0,
                                memberWeSum = 0;
                              activeProjects.forEach((p) => {

                                  totalPmoReq += getEffectiveReq(req).wd;

                                  strokeWidth="1"
                                  strokeDasharray="1 1"
                                />
                                <circle

                                  r="4.5"
                                  fill="#4F46E5"
                                  stroke="#FFFFFF"

                                    const yNextReq =
                                      240 -
                                      (nextPmoReq / Capacity) *
                                        100 *
                                        scaleHeight;
                                    return (
                                      <line
                                        x1={xBase + 13}

                                        x2={xBase + 69}
